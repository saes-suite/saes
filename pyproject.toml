[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saes"
version = "2.1.1"
description = "Stochastic Algorithm Evaluation Suite - Scientific Python library for statistical benchmarking"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Emilio R. Carreira" },
    { name = "Antonio J. Nebro" },
]
keywords = [
    "statistics",
    "benchmarking",
    "metaheuristics",
    "hypothesis-testing",
    "bayesian-statistics",
    "nonparametric",
    "friedman",
    "critical-distance",
    "performance-profiles",
    "stochastic-algorithms",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.4.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/saes-suite/saes"
Documentation = "https://saes-suite.github.io/saes/"
Repository = "https://github.com/saes-suite/saes"
Issues = "https://github.com/saes-suite/saes/issues"
Changelog = "https://github.com/saes-suite/saes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.31",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.27.0",
    "pandas-stubs>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.31",
]
all = [
    "saes[viz,api]",
]

[project.scripts]
saes-api = "saes.server.app:main"

[project.entry-points."saes.plugins"]
pareto = "saes.plugins.pareto.plugin:ParetoPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/saes"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=saes --cov-report=term-missing"
